apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: backend-veyor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # serviceAccountName
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc
      containers: 
      - name: minio
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9000
        - name: console
          containerPort: 9001
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        args:
            - server
            - /data
            - --address
            - ":9000"
            - --console-address
            - ":9001"

