apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-broker
  namespace: backend-veyor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-broker
  template:
    metadata:
      labels:
        app: redis-broker
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: backend-veyor
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-broker