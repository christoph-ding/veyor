apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-postgres
  namespace: backend-veyor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-postgres
  template:
    metadata:
      labels:
        app: metadata-postgres
    spec:
      # serviceAccountName
      volumes:
      - name: metadata-postgres-storage
        persistentVolumeClaim:
          claimName: metadata-postgres-pvc
      containers: 
      - name: metadata-postgres
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5432
        volumeMounts:
        - name: metadata-postgres-storage
          mountPath: /var/lib/postgresql/data
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: metadata-postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: metadata-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: metadata-postgres-secret
              key: POSTGRES_DB
